name: Validate Extension Selectors Manifest

on:
  pull_request:
    paths:
      - 'apps/colabedu-net/public/config/extension-selectors.v1.json'
      - 'apps/colabedu-net/public/config/extension-selectors.schema.json'
      - 'apps/colabedu-net/scripts/validate-extension-selectors.mjs'
  push:
    branches: [master, main]
    paths:
      - 'apps/colabedu-net/public/config/extension-selectors.v1.json'
  workflow_dispatch:

jobs:
  validate-selectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run extension-selectors.v1.json validation gate
        run: node apps/colabedu-net/scripts/validate-extension-selectors.mjs
